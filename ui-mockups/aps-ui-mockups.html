<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS v2 UI Mockups</title>
    <style>
      :root {
        --canvas: #f5f7fa;
        --sidebar: #13202b;
        --sidebar-2: #182a37;
        --panel: #ffffff;
        --panel-soft: #f9fbfd;
        --line: #dfe6ee;
        --line-strong: #c9d3df;
        --text: #17212b;
        --muted: #637181;
        --muted-2: #8a97a6;
        --blue: #1f6feb;
        --blue-soft: #e9f1ff;
        --green: #2f9b66;
        --green-soft: #e9f8f0;
        --orange: #d97706;
        --orange-soft: #fff4df;
        --red: #d64545;
        --red-soft: #fff0f0;
        --purple: #6f5bd6;
        --purple-soft: #f1edff;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        min-height: 1080px;
        margin: 0;
        color: var(--text);
        background: var(--canvas);
        font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      }

      body {
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 252px 1fr;
        width: 1600px;
        height: 1080px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 22px 16px;
        color: #edf5fb;
        background: var(--sidebar);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        display: grid;
        gap: 7px;
        padding: 2px 8px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .brand-title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
      }

      .brand-sub {
        color: #9fb2c3;
        font-size: 12px;
      }

      .nav-group {
        display: grid;
        gap: 8px;
      }

      .nav-heading {
        padding: 0 10px;
        color: #8499ab;
        font-size: 11px;
        font-weight: 700;
      }

      .nav-item {
        display: grid;
        grid-template-columns: 34px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 8px 10px;
        border-radius: var(--radius);
        color: #cfdae4;
      }

      .nav-item.active {
        color: #fff;
        background: #1f6feb;
      }

      .nav-code {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        font-size: 11px;
        font-weight: 800;
      }

      .nav-label {
        display: block;
        font-size: 14px;
        font-weight: 700;
      }

      .nav-hint {
        display: block;
        margin-top: 2px;
        color: rgba(236, 244, 249, 0.62);
        font-size: 11px;
      }

      .sidebar-foot {
        margin-top: auto;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.05);
      }

      .flow-title {
        color: #b8c9d8;
        font-size: 12px;
        font-weight: 800;
      }

      .flow {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .flow-step {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 9px;
        align-items: center;
        font-size: 12px;
        color: #bccbd8;
      }

      .dot {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid #557084;
        font-size: 11px;
      }

      .flow-step.done .dot,
      .flow-step.current .dot {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }

      .main {
        display: grid;
        grid-template-rows: 72px 1fr;
        min-width: 0;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr 360px auto;
        align-items: center;
        gap: 18px;
        padding: 0 28px;
        background: #ffffff;
        border-bottom: 1px solid var(--line);
      }

      .crumb {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .page-name {
        color: var(--text);
        font-size: 19px;
        font-weight: 800;
      }

      .search {
        height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        background: var(--panel-soft);
      }

      .user {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }

      .badge-dot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        color: #fff;
        background: var(--red);
        font-size: 12px;
        font-weight: 800;
      }

      .content {
        padding: 24px 28px 30px;
        overflow: hidden;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 20px;
        margin-bottom: 18px;
      }

      .eyebrow {
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 6px 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 16px;
        border: 1px solid var(--blue);
        border-radius: 6px;
        color: #fff;
        background: var(--blue);
        font-weight: 700;
      }

      .btn.secondary {
        color: var(--text);
        background: #fff;
        border-color: var(--line-strong);
      }

      .btn.green {
        border-color: var(--green);
        background: var(--green);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .cols-4 {
        grid-template-columns: repeat(4, 1fr);
      }

      .cols-3 {
        grid-template-columns: repeat(3, 1fr);
      }

      .cols-2 {
        grid-template-columns: 1.45fr 0.9fr;
      }

      .cols-equal {
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .panel.pad {
        padding: 18px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
      }

      .panel-body {
        padding: 16px 18px;
      }

      .metric {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 12px;
        align-items: center;
        min-height: 104px;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .metric-icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        color: var(--blue);
        background: var(--blue-soft);
        font-weight: 900;
      }

      .metric.green .metric-icon {
        color: var(--green);
        background: var(--green-soft);
      }

      .metric.orange .metric-icon {
        color: var(--orange);
        background: var(--orange-soft);
      }

      .metric.red .metric-icon {
        color: var(--red);
        background: var(--red-soft);
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
      }

      .metric-value {
        margin-top: 4px;
        font-size: 28px;
        font-weight: 900;
      }

      .delta {
        margin-top: 4px;
        color: var(--muted-2);
        font-size: 12px;
      }

      .delta b {
        color: var(--red);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        height: 42px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }

      th {
        color: #334155;
        background: #f7f9fc;
        font-weight: 800;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }

      .tag.blue {
        color: var(--blue);
        background: var(--blue-soft);
      }

      .tag.green {
        color: var(--green);
        background: var(--green-soft);
      }

      .tag.orange {
        color: var(--orange);
        background: var(--orange-soft);
      }

      .tag.red {
        color: var(--red);
        background: var(--red-soft);
      }

      .tag.purple {
        color: var(--purple);
        background: var(--purple-soft);
      }

      .tag.gray {
        color: #607080;
        background: #eef2f6;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .field,
      .select {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        background: #fff;
        font-size: 13px;
      }

      .progress {
        display: inline-grid;
        grid-template-columns: 92px 42px;
        gap: 10px;
        align-items: center;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: #e5eaf0;
        overflow: hidden;
      }

      .fill {
        display: block;
        height: 100%;
        background: var(--blue);
      }

      .fill.green {
        background: var(--green);
      }

      .fill.orange {
        background: var(--orange);
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .issue {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .issue:last-child {
        border-bottom: 0;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        color: #fff;
        font-weight: 900;
      }

      .mark.red {
        background: var(--red);
      }

      .mark.orange {
        background: var(--orange);
      }

      .mark.blue {
        background: var(--blue);
      }

      .issue-title {
        font-weight: 800;
      }

      .issue-meta,
      .small {
        color: var(--muted);
        font-size: 12px;
      }

      .gantt-grid {
        display: grid;
        grid-template-columns: 136px repeat(7, 1fr);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .gantt-cell {
        position: relative;
        min-height: 54px;
        padding: 9px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
        font-size: 12px;
      }

      .gantt-cell.head {
        min-height: 42px;
        color: #334155;
        background: #f7f9fc;
        font-weight: 800;
        text-align: center;
      }

      .gantt-cell.label {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #334155;
        background: #fbfcfe;
        font-weight: 800;
      }

      .task {
        position: absolute;
        top: 14px;
        height: 26px;
        border-radius: 5px;
        color: #fff;
        background: var(--blue);
        font-size: 12px;
        font-weight: 800;
        line-height: 26px;
        text-align: center;
      }

      .task.green {
        background: var(--green);
      }

      .task.orange {
        background: var(--orange);
      }

      .task.gray {
        color: #475569;
        background: #dfe5ec;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
      }

      .step-card {
        min-height: 94px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
      }

      .step-card.active {
        border-color: var(--blue);
        background: var(--blue-soft);
      }

      .step-no {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .step-name {
        margin-top: 9px;
        font-weight: 900;
      }

      .step-status {
        margin-top: 8px;
      }

      .dropzone {
        display: grid;
        place-items: center;
        min-height: 164px;
        border: 1px dashed #9db2c7;
        border-radius: var(--radius);
        background: #f7fbff;
        text-align: center;
      }

      .drop-title {
        font-size: 18px;
        font-weight: 900;
      }

      .split {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        gap: 16px;
      }

      .map-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }

      .health {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .health-card {
        padding: 14px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: #fff;
      }

      .health-card.red {
        border-color: #ffd0d0;
        background: var(--red-soft);
      }

      .health-card.orange {
        border-color: #f7d9a4;
        background: var(--orange-soft);
      }

      .health-card.green {
        border-color: #b7e6ca;
        background: var(--green-soft);
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .time-item {
        display: grid;
        grid-template-columns: 92px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
      }

      .path {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .path span {
        padding: 8px 10px;
        border-radius: 6px;
        color: #fff;
        background: var(--blue);
        font-size: 12px;
        font-weight: 800;
      }

      .path i {
        color: var(--muted-2);
        font-style: normal;
      }

      .board {
        display: grid;
        grid-template-columns: 150px repeat(7, 1fr);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .board-cell {
        position: relative;
        min-height: 70px;
        padding: 9px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .board-cell.head,
      .board-cell.rowhead {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        background: #f7f9fc;
        font-weight: 900;
      }

      .board-cell.off {
        background: #f0f3f6;
      }

      .pill-task {
        display: block;
        width: 100%;
        min-height: 24px;
        margin: 4px 0;
        padding: 5px 8px;
        border-radius: 5px;
        color: #fff;
        background: var(--blue);
        font-size: 12px;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill-task.orange {
        background: var(--orange);
      }

      .pill-task.green {
        background: var(--green);
      }

      .pill-task.gray {
        color: #475569;
        background: #dce4eb;
      }

      /* Reference-style shell: light sidebar and clean top navigation. */
      .app {
        grid-template-columns: 226px 1fr;
        grid-template-rows: 72px 1fr;
        background: var(--canvas);
      }

      .app-header {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: 226px 1fr;
        background: #fff;
        border-bottom: 1px solid #e4e9f0;
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 72px;
        padding: 0 20px;
        border-right: 1px solid #e4e9f0;
      }

      .hamburger {
        position: relative;
        width: 18px;
        height: 14px;
        flex: 0 0 auto;
      }

      .hamburger::before,
      .hamburger::after,
      .hamburger span {
        content: "";
        position: absolute;
        left: 0;
        width: 18px;
        height: 2px;
        border-radius: 999px;
        background: #4b5563;
      }

      .hamburger::before {
        top: 0;
      }

      .hamburger span {
        top: 6px;
      }

      .hamburger::after {
        top: 12px;
      }

      .header-title {
        color: #1264e8;
        font-size: 18px;
        font-weight: 900;
        white-space: nowrap;
      }

      .sidebar {
        grid-column: 1;
        grid-row: 2;
        gap: 6px;
        padding: 16px 10px;
        color: #1f2937;
        background: #fff;
        border-right: 1px solid #e4e9f0;
        overflow: auto;
      }

      .sidebar .brand,
      .sidebar-foot,
      .nav-heading,
      .nav-hint {
        display: none;
      }

      .nav-group {
        gap: 6px;
      }

      .nav-item {
        grid-template-columns: 28px 1fr;
        gap: 13px;
        min-height: 50px;
        padding: 0 14px;
        border-radius: 6px;
        color: #111827;
        background: transparent;
        border: 0;
      }

      .nav-item.active {
        color: #1164e8;
        background: #eaf2ff;
      }

      .nav-code {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 0;
        color: #5d6b7a;
        background: transparent;
      }

      .nav-item.active .nav-code {
        color: #1164e8;
      }

      .nav-icon {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-label {
        font-size: 15px;
        font-weight: 700;
      }

      .main {
        grid-column: 2;
        grid-row: 2;
        grid-template-rows: 1fr;
      }

      .topbar {
        grid-template-columns: 1fr 360px auto;
        height: 72px;
        padding: 0 32px;
        border-bottom: 0;
      }

      .topbar .crumb {
        display: none;
      }

      .content {
        padding: 24px 22px 30px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const nav = [
        ["运行总览", "DB", "首页", "总览与风险", "home"],
        ["数据准备", "IMP", "工单导入", "Excel 预览入库", "import"],
        ["数据准备", "CFG", "资源配置", "工段与设备", "resources"],
        ["数据准备", "MAP", "工序映射", "列名到工段", "mapping"],
        ["数据准备", "PER", "人员档案", "花名册与工段", "personnel"],
        ["数据准备", "RSG", "资源分组", "资源归类", "groups"],
        ["计划执行", "SCH", "排产驾驶台", "队列与排产", "scheduling"],
        ["计划执行", "BD", "生产排班表", "日期矩阵", "board"],
        ["结果分析", "OUT", "订单排产总览", "交付与锁单", "results"],
        ["结果分析", "DTL", "订单排产详情", "零件与工序", "detail"],
        ["结果分析", "GNT", "甘特图", "设备时间轴", "gantt"],
        ["经营问题", "MGT", "经营问题看板", "风险与处理", "management"],
        ["兼容资料", "MCH", "设备管理", "旧 demo 入口", "machines"],
        ["兼容资料", "ORD", "订单管理", "旧 demo 入口", "orders"],
        ["兼容资料", "RTE", "工艺路线", "旧 demo 入口", "routings"]
      ];

      const meta = {
        home: ["运行总览", "轻量级 APS 排产中控", "把订单、工段设备、工艺导入、排产结果和经营风险放在同一个工作入口。"],
        import: ["数据准备", "工单导入与解析确认", "上传 Excel 工艺表，先预览订单、零件、工序和异常，再确认进入待排产队列。"],
        resources: ["数据准备", "资源配置：工段与设备产能", "维护内部工段、外协资源、设备道状态和日可用产能。"],

        return layout("personnel", `<div class="grid cols-4">${metric("执行人员", "58", "PER")}${metric("启用人员", "52", "ON", "green")}${metric("无人员工段", "1", "WARN", "orange")}${metric("停用人员", "6", "OFF", "red")}</div><div class="grid cols-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3 class="panel-title">人员花名册</h3><div class="toolbar"><span class="field">搜索姓名/工号</span><span class="select">所属工段</span></div></div><div class="panel-body"><table><thead><tr><th>工号</th><th>姓名</th><th>所属工段</th><th>状态</th><th>班次</th></tr></thead><tbody>${[["P001","张明","下料","active","白班"],["P002","李强","焊接","active","白班"],["P003","王芳","拼装","active","白班"],["P004","赵磊","机加工","disabled","白班"],["P005","陈静","5m 龙门","active","白班"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3] === "active" ? "green" : "gray"}">${r[3]}</span></td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">按工段关联</h3></div><div class="panel-body"><div class="chip-row">${["下料 8人","焊接 12人","机加工 14人","拼装 10人","5m 龙门 4人","气攻 0人"].map((c, i) => `<span class="chip" style="${i === 5 ? "border-color:#f7d9a4;background:#fff4df;color:#d97706" : ""}">${c}</span>`).join("")}</div><div style="height:18px"></div>${issues()}</div></div></div>`);
      }

      function groupsPage() {
        return layout("groups", `<div class="grid cols-2"><div class="panel"><div class="panel-head"><h3 class="panel-title">资源组</h3><div class="toolbar"><span class="field">搜索资源组</span><span class="select">启用</span></div></div><div class="panel-body"><table><thead><tr><th>编码</th><th>名称</th><th>成员数</th><th>状态</th><th>说明</th></tr></thead><tbody>${[["RG-CUT","下料产能组","9","active","切割与下料"],["RG-WELD","焊接资源组","18","active","焊接设备与人员"],["RG-OUT","外协资源组","4","active","外协工段"],["RG-CNC","机加工资源组","16","active","加工中心"],["RG-OLD","停用资源组","2","disabled","历史兼容"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3] === "active" ? "green" : "gray"}">${r[3]}</span></td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">资源组成员：焊接资源组</h3></div><div class="panel-body"><table><thead><tr><th>类型</th><th>成员</th><th>编码</th><th>状态</th></tr></thead><tbody>${[["工段","焊接","WC-WELD","active"],["设备","焊接-01","M-WELD-01","active"],["设备","焊接-02","M-WELD-02","maintenance"],["人员","李强","P002","active"],["人员","刘杰","P009","active"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3] === "active" ? "green" : "orange"}">${r[3]}</span></td></tr>`).join("")}</tbody></table></div></div></div>`);

        return layout("scheduling", `<div class="grid cols-4">${metric("可排订单", "24", "ORD")}${metric("已选订单", "8", "SEL", "green")}${metric("锁定订单", "3", "LOCK", "orange")}${metric("阻塞问题", "1", "BLK", "red")}</div><div class="grid cols-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3 class="panel-title">排产范围</h3><div class="toolbar"><span class="select">待排+已排</span><span class="field">开始：2026-05-06 08:00</span><span class="select">基准方案 S20260505-01</span></div></div><div class="panel-body"><table><thead><tr><th>选择</th><th>订单号</th><th>客户</th><th>交期</th><th>优先级</th><th>状态</th><th>风险</th></tr></thead><tbody>${[["✓","ORD20260502001","客户A","05-10","高","已排","正常"],["✓","ORD20260502002","客户B","05-11","高","待排","临期"],["✓","ORD20260501003","客户C","05-12","中","待排","正常"],["","ORD20260428009","客户D","05-09","高","已排","已锁"],["✓","ORD20260503005","客户E","05-14","低","待排","正常"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><span class="tag ${r[5] === "已锁" ? "orange" : r[5] === "待排" ? "blue" : "green"}">${r[5]}</span></td><td><span class="tag ${r[6] === "临期" ? "orange" : r[6] === "已锁" ? "gray" : "green"}">${r[6]}</span></td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">运行前检查</h3></div><div class="panel-body"><div class="health"><div class="health-card green"><b>资源覆盖</b><p class="small">11 个工段可参与排产</p></div><div class="health-card orange"><b>锁定避让</b><p class="small">继承 3 张订单占用</p></div><div class="health-card red"><b>阻塞</b><p class="small">气攻无启用设备</p></div></div><div style="height:18px"></div>${issues()}<div style="height:16px"></div><button class="btn green" style="width:100%">运行排产</button></div></div></div>`);
      }

      function resultsPage() {
        return layout("results", `<div class="grid cols-4">${metric("方案版本", "S-0505-02", "VER")}${metric("按期订单", "16", "OK", "green")}${metric("预计延期", "3", "LATE", "orange")}${metric("已锁订单", "5", "LOCK", "red")}</div><div class="grid cols-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3 class="panel-title">订单级结果</h3><div class="toolbar"><span class="select">最新方案</span><span class="field">搜索订单</span></div></div><div class="panel-body"><table><thead><tr><th>订单号</th><th>客户</th><th>预计开始</th><th>预计完成</th><th>延期</th><th>瓶颈</th><th>锁定</th></tr></thead><tbody>${[["ORD20260502001","客户A","05-06 08:00","05-09 15:20","0天","焊接","否"],["ORD20260502002","客户B","05-06 13:00","05-12 16:50","1天","5m 龙门","否"],["ORD20260501003","客户C","05-07 08:00","05-14 10:00","2天","外协","是"],["ORD20260428009","客户D","05-05 08:00","05-08 16:10","0天","下料","是"],["ORD20260503005","客户E","05-09 08:00","05-13 11:30","0天","机加工","否"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[4] === "0天" ? "green" : "orange"}">${r[4]}</span></td><td>${r[5]}</td><td><span class="tag ${r[6] === "是" ? "orange" : "gray"}">${r[6]}</span></td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">结果侧栏</h3></div><div class="panel-body">${loadTable()}<div style="height:16px"></div>${issues()}</div></div></div>`);
      }

      function managementPage() {
        return layout("management", `<div class="grid cols-4">${metric("高风险订单", "5", "RISK", "red")}${metric("已延期", "2", "LATE", "orange")}${metric("瓶颈资源", "3", "BNE", "orange")}${metric("已处理", "8", "DONE", "green")}</div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3 class="panel-title">筛选</h3><div class="toolbar"><span class="select">方案 S-0505-02</span><span class="select">未来 30 天</span><span class="select">全部风险等级</span><span class="select">全部类型</span><span class="field">客户</span><span class="select">处理状态</span></div></div></div><div class="grid cols-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3 class="panel-title">经营问题清单</h3><span class="small">默认按严重程度排序</span></div><div class="panel-body"><table><thead><tr><th>等级</th><th>问题</th><th>对象</th><th>原因</th><th>状态</th><th>备注</th></tr></thead><tbody>${[["高","订单预计延期","ORD20260501003","外协排入 2 天","processing","已联系供应商"],["高","资源瓶颈","5m 龙门","85% 利用率","open","待调整"],["中","关键工序阻塞","气攻","无启用设备","open","待启用"],["中","临近交期","ORD20260502002","剩余缓冲 4 小时","paused","观察"],["低","外协影响","钣金外协","周期未知","resolved","已补周期"]].map((r) => `<tr><td><span class="tag ${r[0] === "高" ? "red" : r[0] === "中" ? "orange" : "blue"}">${r[0]}</span></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[4] === "resolved" ? "green" : r[4] === "processing" ? "blue" : r[4] === "paused" ? "gray" : "orange"}">${r[4]}</span></td><td>${r[5]}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">下钻定位</h3></div><div class="panel-body">${issues()}<div style="height:16px"></div>${loadTable()}</div></div></div>`);
      }

      function detailPage() {
        return layout("detail", `<div class="grid cols-4">${metric("订单", "ORD-0103", "ORD")}${metric("预计完成", "05-14", "FIN", "orange")}${metric("延期", "2天", "LATE", "red")}${metric("关键瓶颈", "外协", "BNE", "orange")}</div><div class="grid cols-2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3 class="panel-title">零件时间线</h3></div><div class="panel-body"><div class="timeline">${[["部件A","下料 > 焊接 > 机加工 > 拼装","05-06 至 05-11","正常"],["子件A-1","下料 > 外协 > 拼装","05-07 至 05-14","延期"],["子件A-2","下料 > 焊接","05-06 至 05-09","正常"],["部件B","下料 > 5m龙门 > 拼装","05-08 至 05-12","临期"]].map((r) => `<div class="time-item"><b>${r[0]}</b><div class="path">${r[1].split(" > ").map((x, i, arr) => `<span>${x}</span>${i < arr.length - 1 ? "<i>></i>" : ""}`).join("")}</div><div><div>${r[2]}</div><span class="tag ${r[3] === "延期" ? "red" : r[3] === "临期" ? "orange" : "green"}">${r[3]}</span></div></div>`).join("")}</div></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">工序明细与依赖解释</h3></div><div class="panel-body"><table><thead><tr><th>工序</th><th>资源</th><th>开始</th><th>结束</th><th>前置</th><th>状态</th></tr></thead><tbody>${[["下料","下料-01","05-06 08:00","05-06 11:30","无","完成"],["焊接","焊接-03","05-07 08:00","05-07 16:00","下料 FS","完成"],["外协","钣金外协","05-08 08:00","05-10 17:00","下料 FS","进行中"],["机加工","加工中心-06","05-11 08:00","05-12 15:00","焊接 FS","计划"],["拼装","拼装-02","05-13 08:00","05-14 10:00","全部子件完成","计划"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><span class="tag ${r[5] === "完成" ? "green" : r[5] === "进行中" ? "blue" : "gray"}">${r[5]}</span></td></tr>`).join("")}</tbody></table></div></div></div>`);
      }

      function boardPage() {
        const rows = ["下料", "焊接", "5m 龙门", "机加工", "拼装", "外协"];
        const days = ["05-05", "05-06", "05-07", "05-08", "05-09", "05-10", "05-11"];
        return layout("board", `<div class="panel"><div class="panel-head"><h3 class="panel-title">日期矩阵</h3><div class="toolbar"><span class="select">按工段</span><span class="select">设备视图</span><span class="select">人员视图</span><span class="field">2026-05-05 至 2026-05-11</span></div></div><div class="panel-body"><div class="board"><div class="board-cell head">资源/日期</div>${days.map((d, i) => `<div class="board-cell head ${i === 5 ? "off" : ""}">${d}<br><span class="small">${i === 5 ? "周日" : "工作日"}</span></div>`).join("")}${rows.map((r, ri) => `<div class="board-cell rowhead">${r}</div>${days.map((d, i) => `<div class="board-cell ${i === 5 ? "off" : ""}">${i === 5 ? "" : (ri + i) % 3 === 0 ? '<span class="pill-task">ORD-0201 A件</span>' : (ri + i) % 3 === 1 ? '<span class="pill-task green">ORD-0103 子件</span>' : '<span class="pill-task orange">ORD-0202 外协</span>'}</div>`).join("")}`).join("")}</div></div></div>`);
      }

      function ganttPage() {
        const rows = ["下料-01", "焊接-03", "龙门-01", "加工中心-06", "拼装-02", "外协-钣金"];
        const days = ["05-05", "05-06", "05-07", "05-08", "05-09", "05-10", "05-11"];
        return layout("gantt", `<div class="panel"><div class="panel-head"><h3 class="panel-title">设备时间轴</h3><div class="toolbar"><span class="select">最新方案</span><span class="select">按周</span><span class="field">搜索设备/订单</span></div></div><div class="panel-body"><div class="gantt-grid"><div class="gantt-cell head">设备</div>${days.map((d) => `<div class="gantt-cell head">${d}</div>`).join("")}${rows.map((r, ri) => `<div class="gantt-cell label">${r}</div>${days.map((d, i) => `<div class="gantt-cell">${(i + ri) % 4 === 0 ? '<span class="task" style="left:7px;width:86%">ORD-A</span>' : (i + ri) % 4 === 1 ? '<span class="task green" style="left:7px;width:72%">ORD-B</span>' : (i + ri) % 4 === 2 ? '<span class="task orange" style="left:7px;width:64%">外协</span>' : '<span class="task gray" style="left:7px;width:40%">空窗</span>'}</div>`).join("")}`).join("")}</div><div class="chip-row" style="margin-top:14px"><span class="chip">蓝色：内部加工</span><span class="chip">绿色：已完成/正常</span><span class="chip">橙色：外协/临期</span><span class="chip">灰色：空窗或休息</span></div></div></div>`);
      }

      function compatible(page, title) {
        return layout(page, `<div class="grid cols-2"><div class="panel"><div class="panel-head"><h3 class="panel-title">${title}列表</h3><div class="toolbar"><span class="field">搜索</span><span class="select">全部状态</span></div></div><div class="panel-body"><table><thead><tr><th>编码</th><th>名称</th><th>归属</th><th>状态</th><th>说明</th></tr></thead><tbody>${[["A001","示例一","主线生产","active","兼容展示"],["A002","示例二","主线生产","active","可迁移"],["A003","示例三","旧 demo","disabled","弱化入口"],["A004","示例四","旧 demo","active","仍可访问"],["A005","示例五","旧 demo","active","不新增依赖"]].map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3] === "active" ? "green" : "gray"}">${r[3]}</span></td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3 class="panel-title">迁移提示</h3></div><div class="panel-body"><div class="health"><div class="health-card green"><b>保留可访问</b><p class="small">不破坏旧演示链路</p></div><div class="health-card orange"><b>主导航弱化</b><p class="small">不作为 APS v2 主流程</p></div><div class="health-card green"><b>主线替代</b><p class="small">生产主线以 production_* 为准</p></div></div><div style="height:18px"></div>${issues()}</div></div></div>`);
      }

      const pages = {
        home,
        import: importPage,
        resources: resourcesPage,
        mapping: mappingPage,
        personnel: personnelPage,
        groups: groupsPage,
        scheduling: schedulingPage,
        board: boardPage,
        results: resultsPage,
        detail: detailPage,
        gantt: ganttPage,
        management: managementPage,
        machines: () => compatible("machines", "设备管理"),
        orders: () => compatible("orders", "订单管理"),
        routings: () => compatible("routings", "工艺路线")
      };

      const page = location.hash ? location.hash.slice(1) : new URLSearchParams(location.search).get("page") || "home";
      document.getElementById("root").innerHTML = (pages[page] || pages.home)();
      window.__apsPages = Object.keys(pages);
    </script>
  </body>
